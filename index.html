</style></head><body>
<header><div class="eyebrow">D. BERNERT · PERSONAL TRAINING</div><h1 id="title">Trainingsübersicht</h1><p id="subtitle">Trainingsplan · Gym · Verlauf</p><div class="brandline"><span>GYM PLAN</span><b>VERSION 1.2.0</b><span>BUILT BY D. BERNERT</span></div></header>
<section id="home" class="screen"><div class="panel"><h3>Mein Gym</h3><div class="row"><select id="gymSelect"></select><button class="btn" style="margin:5px 0;flex:0 0 45px" id="addGym">＋</button><button class="btn secondary" style="margin:5px 0;flex:0 0 45px" id="delGym">−</button></div><small style="color:var(--muted)">Aktuelles Gym wird bei Training und Kalender gespeichert.</small></div>
<div class="week"><button class="day daybtn" data-w="0"><span>MO</span><b>Oberkörper A</b><small>Push · Pull</small><em>Training öffnen ↗</em></button><button class="day daybtn" data-w="1"><span>DI</span><b>Unterkörper A</b><small>Beine · Core</small><em>Training öffnen ↗</em></button><div class="day rest"><span>MI</span><b>Rest Day</b></div><button class="day daybtn" data-w="2"><span>DO</span><b>Oberkörper B</b><small>Schulter · Rücken</small><em>Training öffnen ↗</em></button><button class="day daybtn" data-w="3"><span>FR</span><b>Unterkörper B</b><small>Beine · Core</small><em>Training öffnen ↗</em></button><div class="day rest"><span>SA / SO</span><b>Rest Day</b></div></div>
<button class="btn secondary" id="calendarBtn">📅 Trainingshistorie / Kalender</button><div class="foot"><button id="backup">Backup exportieren</button><button id="restore">Backup importieren</button><input id="file" type="file" accept="application/json" hidden></div></section>
<section id="workout" class="screen" hidden><button class="back" id="homeback">← Übersicht</button><div id="exercises"></div></section>
<section id="detail" class="screen" hidden><button class="back" id="workback">← Training</button><div id="details"></div></section>
<section id="calendar" class="screen" hidden><button class="back" id="calback">← Übersicht</button><div class="panel"><div class="row"><button class="btn secondary" id="prev">‹</button><h3 id="month" style="text-align:center;flex:3"></h3><button class="btn secondary" id="next">›</button></div><div id="calgrid" class="calendargrid"></div><p style="color:var(--muted);font-size:.8rem">Trainingstage sind grün markiert. Datum antippen für Details oder Eintrag.</p></div><div id="caldetail"></div></section>
<script>
const W=[
["Oberkörper A",[["Cable External Rotation","1 × 15 / Seite",0],["Chest Press","2 × 6–8",2],["Lat Pulldown","2 × 6–8",2],["Seated Row","2 × 6–8",2],["Incline Chest Press","2 × 8–12",2],["Seitheben (Kurzhanteln)","2 × 8–12",2],["Biceps Curl","2 × 8–12",2],["Triceps Pushdown","2 × 8–12",2]]],
["Unterkörper A",[["Leg Press","2 × 6–8",2],["Seated Leg Curl","2 × 8–12",2],["Leg Extension","2 × 8–12",2],["Wadenheben frei","3 × 8–12",3],["Adductor Machine","2 × 8–12",2],["Abdominal Machine","2 × 10–15",2]]],
["Oberkörper B",[["Cable External Rotation","1 × 15 / Seite",0],["Shoulder Press","2 × 6–8",2],["Lat Pulldown","2 × 8–12",2],["Chest Press","2 × 8–12",2],["Reverse Fly / Rear Delt","2 × 8–12",2],["Seitheben (Kurzhanteln)","2 × 8–12",2],["Hammer Curl","2 × 8–12",2],["Triceps Pushdown","2 × 8–12",2]]],
["Unterkörper B",[["Hip Thrust","2 × 6–8",2],["Seated Leg Curl","2 × 8–12",2],["Leg Press","2 × 8–12",2],["Leg Extension","2 × 8–12",2],["Wadenheben frei","3 × 8–12",3],["Adductor Machine","2 × 8–12",2],["Abdominal Machine","2 × 10–15",2]]]];
const KEY="gymCleanV3";let D={exercise:{},sessions:{},gyms:["Mein Gym","Gym 2","Gym 3"],gym:"Mein Gym"};
try{D=JSON.parse(localStorage.getItem(KEY))||D}catch(e){};if(!D.gyms)D.gyms=["Mein Gym"];if(!D.gym)D.gym=D.gyms[0];
let wi=0,ei=0,calDate=new Date(),selectedDate=iso(new Date());const $=id=>document.getElementById(id);
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
function exd(n){return D.exercise[n]||(D.exercise[n]={pr:"",work:""})}
function sessionExerciseName(key,s){if(s&&s.exercise)return s.exercise;let rest=String(key);if(rest.length>=11&&rest[10]==="_")rest=rest.slice(11);let gyms=[...(D.gyms||[]),s&&s.gym,D.gym].filter(Boolean);gyms=[...new Set(gyms)].sort((a,b)=>b.length-a.length);for(let g of gyms){if(rest.startsWith(g+"_"))return rest.slice(g.length+1)}let p=rest.indexOf("_");return p>=0?rest.slice(p+1):rest}
function calculatePR(n){
  const d=exd(n);
  let best=0;
  Object.entries(D.sessions||{}).forEach(([key,s])=>{
    const same=(String(s.exercise||"").trim()===String(n).trim()) ||
      (!s.exercise && sessionExerciseName(key,s)===n);
    if(!same)return;
    (Array.isArray(s.sets)?s.sets:[]).forEach(v=>{
      const kg=Number(String(v.kg??v.weight??"").replace(",","."));
      if(Number.isFinite(kg)&&kg>best)best=kg;
    });
  });
  // Keep a manually entered baseline if it exceeds logged sets.
  const manual=Number(String(d.pr||"").replace(",","."));
  if(Number.isFinite(manual)&&manual>best)best=manual;
  d.pr=best?String(best):"";
  return best;
}
function updateWorkWeight(n,s){
 const d=exd(n),base=Number(String(d.work||0).replace(",","."));
 const sets=(s.sets||[]).map(v=>({kg:Number(String(v.kg??v.weight??0).replace(",",".")),rep:Number(v.rep??v.reps)})).filter(v=>v.kg>0&&Number.isInteger(v.rep)&&v.rep>0);
 // Ein deutlich leichter erster Satz ist Warm-up und wird nicht bewertet.
 const workSets=sets.filter((v,i)=>!(i===0&&base>0&&v.kg<base*.75));
 if(!workSets.length)return base||0;
 const reps=workSets.map(v=>v.rep);
 if(reps.some(r=>r>10)){d.work=String(Math.round(Math.max(...workSets.filter(v=>v.rep>10).map(v=>v.kg))*1.025*10)/10)}
 else if(reps.some(r=>r<5)){d.work=String(Math.round(Math.min(...workSets.filter(v=>v.rep<5).map(v=>v.kg))*.975*10)/10)}
 // 6–8 reps (sowie 5/9/10) bestätigen das aktuelle Arbeitsgewicht.
 save();return Number(d.work||base||0)
}
function machineD(n){D.machines=D.machines||{};D.machines[D.gym]=D.machines[D.gym]||{};return D.machines[D.gym][n]||(D.machines[D.gym][n]={machine:"",settings:""})}
function warm(n){let w=+exd(n).work;return w?Math.max(1,Math.round(w*.5*2)/2)+" kg × 5–8":"—"}
function show(s){["home","workout","detail","calendar"].forEach(x=>$(x).hidden=x!==s)}
function gymOptions(){let sel=$("gymSelect");sel.innerHTML="";D.gyms.forEach(g=>{let o=document.createElement("option");o.textContent=g;o.value=g;sel.append(o)});sel.value=D.gym}
gymOptions();$("gymSelect").onchange=e=>{D.gym=e.target.value;save()};
$("addGym").onclick=()=>{let g=prompt("Name des neuen Gyms:");if(g&&g.trim()&&!D.gyms.includes(g.trim())){D.gyms.push(g.trim());D.gym=g.trim();gymOptions();save()}};
$("delGym").onclick=()=>{if(D.gyms.length<=1){alert("Mindestens ein Gym muss bleiben.");return}let g=D.gym;if(!confirm('Gym „'+g+'“ löschen? Maschineninfos dieses Gyms werden ebenfalls gelöscht. Trainingshistorie bleibt erhalten.'))return;D.gyms=D.gyms.filter(x=>x!==g);if(D.machines)delete D.machines[g];D.gym=D.gyms[0];gymOptions();save()};
document.querySelectorAll(".daybtn").forEach(b=>b.onclick=()=>openW(+b.dataset.w));
function plan(i){D.plan=D.plan||{};if(!D.plan[i])D.plan[i]=W[i][1].map(e=>({name:e[0],scheme:e[1],count:e[2]}));return D.plan[i]}
function openW(i){wi=i;show("workout");$("title").textContent=W[i][0];$("subtitle").textContent=["Montag","Dienstag","Donnerstag","Freitag"][i]+" · "+D.gym;$("exercises").innerHTML="<h2>Übungen</h2>";let warmup=document.createElement("div");warmup.className="panel warm";warmup.innerHTML="<b>Warm-up</b><p>5 Min. Fahrrad + 4 Min. Laufband</p>";$("exercises").append(warmup);plan(i).forEach((e,j)=>exerciseButton([e.name,e.scheme,e.count],j,false));let addMain=document.createElement("button");addMain.className="btn secondary";addMain.textContent="+ Übung hinzufügen";addMain.onclick=()=>{let name=prompt("Übungsname:");if(!name)return;let scheme=prompt("Satz-/Wiederholungsvorgabe:","2 × 8–12")||"2 × 8–12";let count=parseInt((scheme.match(/^(\d+)/)||[])[1])||2;plan(i).push({name,scheme,count});save();openW(i)};$("exercises").append(addMain);let opt=document.createElement("div");opt.className="optional";opt.innerHTML='<h2>OPTIONALE ÜBUNGEN</h2><small style="color:var(--muted)">Zusatz – nur wenn du möchtest</small>';let extras=(D.extra&&D.extra[i])||[];extras.forEach((e,j)=>exerciseButton([e.name,e.scheme||"optional",2],j,true,opt));let add=document.createElement("button");add.className="btn secondary";add.textContent="+ Optionale Übung hinzufügen";add.onclick=()=>{let n=prompt("Übungsname:");if(!n)return;D.extra=D.extra||{};D.extra[i]=D.extra[i]||[];D.extra[i].push({name:n,scheme:"optional"});save();openW(i)};opt.append(add);$("exercises").append(opt)}
function editExercise(j){let e=plan(wi)[j],name=prompt("Übungsname:",e.name);if(name===null)return;let scheme=prompt("Satz-/Wiederholungsvorgabe:",e.scheme);if(scheme===null)return;e.name=name.trim()||e.name;e.scheme=scheme;e.count=parseInt((scheme.match(/^(\d+)/)||[])[1])||0;save();openW(wi)}
function moveExercise(j,dir){let arr=plan(wi),to=j+dir;if(to<0||to>=arr.length)return;[arr[j],arr[to]]=[arr[to],arr[j]];save();openW(wi)}
function deleteExercise(j){if(!confirm("Übung aus diesem Split löschen?"))return;plan(wi).splice(j,1);save();openW(wi)}
function exerciseButton(e,j,isExtra,parent){let n=e[0],d=exd(n),pr=calculatePR(n),b=document.createElement("div");b.className="exercise";b.innerHTML='<span class="exname"><b>'+n+'</b><small>'+e[1]+'</small></span><span class="stats"><span class="work">W '+(d.work||"—")+'</span><span class="pr">PR '+(pr||"—")+'</span></span><div class="ex-actions"><button class="iconbtn edit" title="Bearbeiten">✎</button><button class="iconbtn up" title="Nach oben">↑</button><button class="iconbtn down" title="Nach unten">↓</button><button class="iconbtn delete" title="Löschen">🗑</button><button class="iconbtn machine" title="Maschine">⚙</button></div>';b.querySelector(".exname").onclick=()=>openE(n,e[2],isExtra);b.querySelector(".stats").onclick=()=>openE(n,e[2],isExtra);b.querySelector(".edit").onclick=()=>isExtra?editExtra(j):editExercise(j);b.querySelector(".up").onclick=()=>isExtra?moveExtra(j,-1):moveExercise(j,-1);b.querySelector(".down").onclick=()=>isExtra?moveExtra(j,1):moveExercise(j,1);b.querySelector(".delete").onclick=()=>isExtra?deleteExtra(j):deleteExercise(j);b.querySelector(".machine").onclick=()=>machineInfo(n);(parent||$("exercises")).append(b)}
function editExtra(j){let e=D.extra[wi][j],n=prompt("Übungsname:",e.name);if(n===null)return;e.name=n;let sc=prompt("Vorgabe:",e.scheme||"optional");if(sc===null)return;e.scheme=sc;save();openW(wi)}
function moveExtra(j,dir){let a=D.extra[wi],to=j+dir;if(to<0||to>=a.length)return;[a[j],a[to]]=[a[to],a[j]];save();openW(wi)}
function deleteExtra(j){if(!confirm("Optionale Übung löschen?"))return;D.extra[wi].splice(j,1);save();openW(wi)}
function machineInfo(n){let d=machineD(n);let machine=prompt("Maschine / Gerätename für „"+D.gym+"“:",d.machine||"");if(machine===null)return;let settings=prompt("Einstellungen (Sitzhöhe, Polster, Griff etc.):",d.settings||"");if(settings===null)return;d.machine=machine;d.settings=settings;save();alert("Maschineninfo für "+D.gym+" gespeichert.")}
function openE(n,count,extra){ei=n;calculatePR(n);show("detail");$("title").textContent=n;$("subtitle").textContent=(extra?"OPTIONAL · ":"")+D.gym;$("details").innerHTML='<div class="panel"><h3>Übungsdaten</h3><div class="grid"><label>Arbeitsgewicht (kg)<input id="work" type="number" step="0.1" placeholder="kg" value="'+exd(n).work+'"></label><label>PR (kg)<input id="pr" type="number" step="0.1" placeholder="kg" value="'+exd(n).pr+'"></label></div><div class="warm" id="warm"></div><p style="color:var(--muted);font-size:.8rem" id="machine"></p></div><button class="btn" id="start">Arbeitssätze öffnen ↓</button><div id="sets"></div>';let d=exd(n),md=machineD(n);function upd(){d.work=$("work").value;save();$("warm").textContent="Warm-up: "+warm(n)+(d.work?" · Arbeitsgewicht "+d.work+" kg":"");$("machine").textContent=(md.machine||"Maschine in "+D.gym+" nicht hinterlegt")+(md.settings?" · "+md.settings:"")};$("work").oninput=()=>{d.work=$("work").value;save();$("warm").textContent="Warm-up: "+warm(n)+(d.work?" · Arbeitsgewicht "+d.work+" kg":"")};$("pr").oninput=()=>{d.pr=$("pr").value;save()};upd();$("start").onclick=()=>{let area=$("sets"),btn=$("start");if(area.innerHTML.trim()){let closed=area.style.display==="none";area.style.display=closed?"block":"none";btn.textContent=closed?"Arbeitssätze schließen ↑":"Arbeitssätze öffnen ↓"}else{setEntry(n,count||2);btn.textContent="Arbeitssätze schließen ↑";$("sets").style.display="block"}}}
function setEntry(n,count){let k=selectedDate+"_"+D.gym+"_"+n,s=D.sessions[k]||(D.sessions[k]={sets:[],workout:W[wi][0],gym:D.gym,date:selectedDate,exercise:n});s.exercise=s.exercise||n;let area=$("sets");area.innerHTML='<h2>Satzauswertung</h2><button class="btn danger" id="resetAll">Alle Sätze löschen</button><details open id="setDetails"><summary>Sätze ein-/ausblenden</summary><div class="setgrid" id="setgrid"></div><div id="setform"></div></details>'; $("resetAll").onclick=()=>{if(confirm("Alle Sätze dieser Übung für diesen Tag löschen?")){s.sets=[];save();refresh();form()}};
function refresh(){let g=$("setgrid");g.innerHTML="";s.sets.forEach((v,x)=>{let z=document.createElement("div");z.className="setmini active";z.innerHTML="Satz "+(x+1)+"<b>"+v.kg+" kg · "+v.rep+" Wdh</b><button class=iconbtn data-del="+x+" title='Satz löschen'>🗑</button>";z.querySelector("button").onclick=()=>{if(confirm("Satz "+(x+1)+" löschen?")){s.sets.splice(x,1);save();refresh();form()}};g.append(z)});let next=document.createElement("div");next.className="setmini";next.innerHTML="Satz "+(s.sets.length+1)+"<b>bereit</b>";g.append(next)}
function form(){let i=s.sets.length,f=$("setform");f.innerHTML='<div class="setcard"><h3>Satz '+(i+1)+' eintragen</h3><div class="grid"><label>Gewicht (kg)<input id="kg" type="number" step="0.1" placeholder="kg"></label><label>Wiederholungen<input id="rep" type="number" placeholder="Wdh."></label></div><button class="btn">Satz '+(i+1)+' speichern ✓</button></div>';f.querySelector("button").onclick=()=>{let kg=$("kg").value,rep=$("rep").value;if(!kg||!rep){alert("Bitte Gewicht und Wiederholungen eingeben.");return}let weight=Number(kg),reps=Number(rep);if(!Number.isFinite(weight)||weight<0||!Number.isInteger(reps)||reps<1){alert("Bitte gültiges Gewicht und ganze Wiederholungszahl eingeben.");return}
let oldPR=calculatePR(n);
s.sets.push({kg:String(weight),rep:String(reps)});
updateWorkWeight(n,s);
const newPR=weight>oldPR;
const actualPR=calculatePR(n);
save();
if($("pr"))$("pr").value=actualPR?String(actualPR):"";
if(newPR)alert("NEUER PR! "+weight.toLocaleString("de-DE",{maximumFractionDigits:1})+" kg – tatsächlich bewegt 🏆");
refresh();form()}}
refresh();form()}

$("calendarBtn").onclick=calendarOpen;$("calback").onclick=()=>show("home");
function calendarOpen(){show("calendar");calendarRender()}
function calendarRender(){let y=calDate.getFullYear(),m=calDate.getMonth();$("month").textContent=calDate.toLocaleDateString("de-DE",{month:"long",year:"numeric"});let g=$("calgrid");g.innerHTML="";["Mo","Di","Mi","Do","Fr","Sa","So"].forEach(x=>{let d=document.createElement("div");d.className="calhead";d.textContent=x;g.append(d)});let first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)g.append(document.createElement("div"));for(let d=1;d<=days;d++){let date=iso(new Date(y,m,d)),b=document.createElement("button");b.className="calday"+(Object.values(D.sessions).some(s=>s.date===date)?" has":"")+(date===selectedDate?" selected":"");b.textContent=d;b.onclick=()=>{selectedDate=date;calendarRender();calendarDetail(date)};g.append(b)}calendarDetail(selectedDate)}
function calendarDetail(date){let a=Object.values(D.sessions).filter(s=>s.date===date);$("caldetail").innerHTML='<h2>'+new Date(date+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long"})+'</h2>'+a.map(s=>'<div class="entry"><b>'+s.workout+' · '+s.exercise+'</b><br><small>'+s.gym+' · '+(s.sets||[]).length+' Sätze</small><div>'+(s.sets||[]).map((v,i)=>'Satz '+(i+1)+': '+v.kg+' kg × '+v.rep+' Wdh.').join('<br>')+'</div></div>').join("")+'<button class="btn secondary" id="manual">Training für diesen Tag eintragen / nachholen</button>'; $("manual").onclick=()=>{let w=prompt("Welche Einheit? 1 Oberkörper A, 2 Unterkörper A, 3 Oberkörper B, 4 Unterkörper B");let i=+w-1;if(i<0||i>3)return;wi=i;show("workout");selectedDate=date;openW(i)}}
$("prev").onclick=()=>{calDate.setMonth(calDate.getMonth()-1);calendarRender()};$("next").onclick=()=>{calDate.setMonth(calDate.getMonth()+1);calendarRender()};
$("backup").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"Gym Plan",version:"1.2.0",author:"D. Bernert",exportedAt:new Date().toISOString(),data:D,sessions:D.sessions||{}})],{type:"application/json"}));a.download="gym-backup.json";a.click()};
$("restore").onclick=()=>$("file").click();$("file").onchange=async e=>{try{let imported=JSON.parse(await e.target.files[0].text());
D=imported.data||imported;
if(imported.sessions&&!D.sessions)D.sessions=imported.sessions;
D.sessions=D.sessions||{};
D.exercise=D.exercise||{};
D.gyms=D.gyms||["Mein Gym"];D.gym=D.gym||D.gyms[0];
save();gymOptions();alert("Backup inkl. Trainingssätzen geladen")}catch{alert("Backup ungültig")}};
</script></body></html>
